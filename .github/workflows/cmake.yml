name: CMake

on:
  push:
    branches:
      - "*"
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        name:
          - win32
          - linux-x64
        include:
          - name: win32
            os: windows-latest
            cmake_opts: -A Win32
          - name: linux-x64
            os: ubuntu-24.04
            cmake_opts: -G Ninja -DCMAKE_BUILD_TYPE=Release
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v2
    - name: Setup
      run: |
        mkdir build
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build libsdl2-dev libgl1-mesa-dev libssl-dev
    - name: Build
      run: |
        cmake .. ${{ matrix.cmake_opts }}
        cmake --build . --config Release
      working-directory: ./build
    - name: Package
      run: |
        cmake --build . --config Release --target package
        cmake -E remove_directory ./pkg/_CPack_Packages
      working-directory: ./build
    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.name }}
        path: build/pkg
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download win32
        uses: actions/download-artifact@v8
        with:
          name: win32
          path: pkg
      - name: Download linux-x64
        uses: actions/download-artifact@v8
        with:
          name: linux-x64
          path: pkg
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: "pkg/*"
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
